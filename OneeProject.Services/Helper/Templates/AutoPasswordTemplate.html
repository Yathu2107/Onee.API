<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome to Onee</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background-color: #27AE60;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .content {
            padding: 30px 25px;
            color: #333333;
            line-height: 1.6;
        }

        .password-box {
            background-color: #eafaf1;
            border: 2px dashed #27AE60;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            color: #27AE60;
            letter-spacing: 4px;
        }

        .footer {
            padding: 20px 25px;
            font-size: 14px;
            color: #777777;
            text-align: center;
            background-color: #f4f6f8;
        }

        b {
            color: #27AE60;
        }

        .cta {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 25px;
            background-color: #27AE60;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                Welcome to Onee!
            </div>
            <div class="content">
                <p>Hello,</p>
                <p>We are excited to have you on board. Your account has been created successfully.</p>
                <p>Your temporary password is:</p>
                <div class="password-box">{{PASSWORD}}</div>
                <p>Please log in and change your password immediately for security.</p>
                <p style="text-align:center;">
                    <a href="https://your-login-url.com" class="cta">Log In Now</a>
                </p>
                <p>Thank you,<br />Onee Team</p>
            </div>
            <div class="footer">
                &copy; 2026 Onee. All rights reserved.
            </div>
        </div>
    </body>
    </html>
